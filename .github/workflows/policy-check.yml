name: Policy Check

on:
  push:
    branches:
      - develop
      - release
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-policy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # Cache uploads are held pending content review.

      - name: Check source distribution
        run: python src/repository_publication.py --ref HEAD

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --extra dev

      - name: Validate release governance contract
        run: uv run python src/governance_validation.py

      - name: Validate workflow policy contract
        run: uv run python src/workflow_policy_validation.py
