name: Security

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          # Cache uploads are held pending content review.

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --extra dev

      - name: Dependency vulnerability audit (pip-audit)
        shell: bash
        run: |
          uv pip install --python .venv/bin/python pip-audit
          python scripts/security_check.py dependencies

      - name: Secret scan of committed tree (Gitleaks)
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/security_check.py secrets
